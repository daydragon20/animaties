<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout Atlas 2027</title>
<style>
/*__FONTS__*/
:root{
  --disp:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body.idle,body.idle *{cursor:none!important}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:#071519;color:#ede6d1;font-family:var(--mono);-webkit-font-smoothing:antialiased}
.L{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.a{position:absolute;white-space:nowrap}
.kick{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.32em;text-transform:uppercase}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.disp{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.9}
.mono{font-family:var(--mono)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .05em .14em;margin:0 -.05em}
.w>span{display:inline-block}
svg text{font-family:var(--mono)}
#gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
.lab3{position:absolute;left:0;top:0;pointer-events:none}
.lab3 .dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#12876a;border:2px solid #f8f3e6;box-shadow:0 2px 6px rgba(16,38,44,.35)}
.lab3 .pill{position:absolute;padding:3px 9px;border-radius:5px;font:600 18px var(--mono);white-space:nowrap;background:rgba(248,243,230,.92);color:#10262c;box-shadow:0 2px 8px rgba(16,38,44,.18)}

/* bediening (hoort niet bij de film zelf) */
#ui{position:fixed;inset:0;pointer-events:none;font-family:var(--mono);color:#ede6d1}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:rgba(4,12,14,.8);pointer-events:auto;cursor:pointer;transition:opacity .35s}
#start.gone{opacity:0;pointer-events:none}
#start .big{width:132px;height:132px;border-radius:50%;border:2px solid #7cf0c4;display:grid;place-items:center}
#start .big svg{margin-left:10px}
#start .t{font-family:var(--disp);font-weight:800;font-size:44px;letter-spacing:.06em;text-transform:uppercase}
#start .h{font-size:14px;color:#7f9d9a;letter-spacing:.08em;text-align:center;line-height:1.8}
#start .snd{font-size:14px;color:#f6e6a2;letter-spacing:.08em}
#bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(900px,92vw);display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:rgba(6,18,21,.88);border:1px solid rgba(124,240,196,.25);border-radius:999px;
  pointer-events:auto;transition:opacity .35s, transform .35s}
#bar.hide{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
#bar button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#ede6d1}
#bar button:hover{background:rgba(124,240,196,.14)}
#bar button:focus-visible{outline:2px solid #7cf0c4}
#time{font-size:13px;color:#7f9d9a;min-width:104px;text-align:center;font-variant-numeric:tabular-nums}
#scrub{flex:1;height:22px;display:flex;align-items:center;cursor:pointer;position:relative}
#scrub .tr{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(237,230,209,.18)}
#scrub .fi{position:absolute;left:0;height:4px;border-radius:2px;background:#7cf0c4}
#scrub .kn{position:absolute;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#7cf0c4}
#scrub .ch{position:absolute;width:2px;height:10px;margin-left:-1px;background:rgba(237,230,209,.35)}
</style>
<!--__THREE__-->
</head>
<body>
<div id="stage"></div>

<div id="ui">
  <div id="start" role="button" tabindex="0" aria-label="Film afspelen">
    <div class="big"><svg width="44" height="50" viewBox="0 0 44 50"><path d="M2 2 L42 25 L2 48 Z" fill="#7cf0c4"/></svg></div>
    <div class="t">Scout Atlas 2027</div>
    <div class="snd" id="sndState">geluid wordt voorbereid…</div>
    <div class="h">Klik of druk op spatie om af te spelen · zet je geluid aan<br>spatie = pauze · ← → = 5 s · R = opnieuw · M = geluid · F = volledig scherm · H = bediening verbergen</div>
  </div>
  <div id="bar">
    <button id="bRestart" title="Opnieuw (R)" aria-label="Opnieuw"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 2v14M15 2 6 9l9 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button id="bPlay" title="Afspelen / pauzeren (spatie)" aria-label="Afspelen of pauzeren"></button>
    <div id="time">0:00 / 0:00</div>
    <div id="scrub" aria-label="Tijdlijn"><div class="tr"></div><div class="fi"></div><div class="kn"></div></div>
    <button id="bMute" title="Geluid aan/uit (M)" aria-label="Geluid aan of uit"></button>
    <button id="bFull" title="Volledig scherm (F)" aria-label="Volledig scherm"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6V1h5M12 1h5v5M17 12v5h-5M6 17H1v-5"/></svg></button>
  </div>
</div>

<script>
"use strict";
const DATA = /*__DATA__*/null;
const MAP = /*__MAP__*/null;

/* ───────────── hulpjes ───────────── */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, html) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") e.className = attrs[k];
    else if (k === "style") e.style.cssText = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function sv(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: (p) => 1 - Math.pow(1 - p, 3),
  out5: (p) => 1 - Math.pow(1 - p, 5),
  inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  inOut2: (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2),
  in: (p) => p * p * p,
  back: (p) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
function win(t, a, b, fi = 0.4, fo = 0.4) {
  if (t < a || t > b) return 0;
  return Math.min(fi > 0 ? E.out(seg(t, a, a + fi)) : 1, fo > 0 ? 1 - E.inOut(seg(t, b - fo, b)) : 1);
}
function set(e, o, x = 0, y = 0, s = 1, r = 0) {
  e.style.opacity = o;
  e.style.visibility = o <= 0.002 ? "hidden" : "visible";
  e.style.transform = `translate(${x}px,${y}px) scale(${s})` + (r ? ` rotate(${r}deg)` : "");
}
function op(e, o) { e.style.opacity = o; e.style.visibility = o <= 0.002 ? "hidden" : "visible"; }
function inout(e, t, a, b, d = 0.4, dist = 26) {
  const pi = E.out5(seg(t, a, a + d)), po = E.in(seg(t, b - 0.3, b));
  set(e, pi * (1 - po), 0, (1 - pi) * dist - po * dist);
}
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hexLerp = (h1, h2, p) => {
  const a = h1.replace("#", "").match(/\w\w/g).map((x) => parseInt(x, 16)), b = h2.replace("#", "").match(/\w\w/g).map((x) => parseInt(x, 16));
  return "#" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(p))).toString(16).padStart(2, "0")).join("");
};
// Getallen exact zoals in de JSON, enkel met Nederlandse komma.
// Totalen en categoriescores tonen we met minstens één decimaal (90 → "90,0"): zelfde waarde, niet afgerond.
function nl(x, minDec = 1) {
  let s = String(x);
  if (minDec > 0 && !s.includes(".")) s += "." + "0".repeat(minDec);
  return s.replace(".", ",");
}
function words(parent, text) {
  const out = [];
  text.split(" ").forEach((w, i, arr) => {
    const o = el("span", { class: "w" }, parent);
    out.push(el("span", {}, o, w));
    if (i < arr.length - 1) parent.appendChild(document.createTextNode(" "));
  });
  return out;
}
function revealWords(ws, t, a, step = 0.06, dur = 0.4) {
  ws.forEach((w, i) => {
    const p = E.out5(seg(t, a + i * step, a + i * step + dur));
    w.style.transform = `translateY(${(1 - p) * 110}%)`;
    w.style.opacity = p;
  });
}

/* ───────────── kleuren: nacht (donker) en dag (atlaspapier) ───────────── */
const N = { bg: "#071519", paper: "#ede6d1", mint: "#7cf0c4", sun: "#f6e6a2", coral: "#ff8b66", muted: "#7f9d9a", soft: "#a9bdb9" };
const D = { bg: "#efe7d4", ink: "#10262c", mint: "#12876a", mintL: "#5cc79c", ochre: "#b47a0a", coral: "#d24a2a", sub: "#55706a", soft: "#6f8580", card: "#f8f3e6" };

/* ───────────── data ───────────── */
const V = DATA.variables, R = DATA.ranking;
const CATS = [...new Set(V.map((v) => v.category))];
const catW = {};
V.forEach((v) => { catW[v.category] = (catW[v.category] || 0) + v.weight; });
const byWeight = [...CATS].sort((a, b) => catW[b] - catW[a]);
const C = (name) => { const r = R.find((x) => x.country === name); if (!r) throw new Error("Land ontbreekt: " + name); return r; };
const TOP = R.slice(0, 10);
const isTop = (n) => TOP.some((r) => r.country === n);
const WIN = R[0];
const heaviest = V.reduce((a, b) => (b.weight > a.weight ? b : a));
const lightest = V.reduce((a, b) => (b.weight < a.weight ? b : a));
const topMax = {}, topMin = {};
CATS.forEach((c) => { topMax[c] = Math.max(...TOP.map((r) => r.categories[c])); topMin[c] = Math.min(...TOP.map((r) => r.categories[c])); });
const bestIn = (r) => CATS.filter((c) => r.categories[c] === topMax[c]);
const worstIn = (r) => CATS.filter((c) => r.categories[c] === topMin[c]);
const lowestCat = (r) => CATS.reduce((a, c) => (r.categories[c] < r.categories[a] ? c : a), CATS[0]);
const highestCat = (r) => CATS.reduce((a, c) => (r.categories[c] > r.categories[a] ? c : a), CATS[0]);
const YEAR = (DATA.scope.match(/(20\d\d)/) || [])[1];
const MONTHS = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const [gy, gm, gd] = DATA.generated.split("-").map(Number);
const GEN = `${gd} ${MONTHS[gm - 1]} ${gy}`;
const pinOrder = Object.keys(MAP.pts).filter((n) => n !== "België").sort((a, b) => MAP.pts[a][0] - MAP.pts[b][0]);
pinOrder.forEach((n) => C(n)); // controle: elke kaartnaam bestaat in de JSON

// Race: gewogen tussenstand van de top 10 na elke categorie (zwaarste eerst), op de ruwe scores.
// Na de laatste categorie gebruiken we exact de eindscore en volgorde uit de JSON.
const RACE = (() => {
  const acc = TOP.map(() => [0, 0]);
  return byWeight.map((c, k) => {
    TOP.forEach((r, j) => V.forEach((v, i) => { if (v.category === c) { acc[j][0] += v.weight * r.scores[i]; acc[j][1] += v.weight; } }));
    const last = k === byWeight.length - 1;
    const val = TOP.map((r, j) => (last ? r.total : acc[j][0] / acc[j][1]));
    const order = last ? TOP.map((_, j) => j) : TOP.map((_, j) => j).sort((a, b) => val[b] - val[a]);
    const pos = []; order.forEach((j, p) => (pos[j] = p));
    return { c, val, pos, leader: TOP[order[0]], order };
  });
})();

/* ───────────── tijdlijn ───────────── */
const T = { s1: 0, s2: 8, s3: 22, s4: 30, s5: 52, s6: 66, s7: 76, end: 88 };
const CHAPTERS = [["De vraag", T.s1], ["De weging", T.s2], ["De kandidaten", T.s3], ["De race", T.s4], ["Het vergelijk", T.s5], ["Het podium", T.s6], ["Eerlijk is eerlijk", T.s7]];
const CUE = {
  hook: [2.0, 3.9, 5.9], sunrise: [3.4, 4.2], push: 6.5,
  countA: T.s2 + 0.2, countB: T.s2 + 1.6,
  grow: T.s2 + 2.9, fly: T.s2 + 4.9,
  fillA: T.s2 + 6.0, fillB: T.s2 + 8.0,
  hl: T.s2 + 8.6, coral: T.s2 + 11.2,
  pinA: T.s3 + 0.8, pinStep: 0.12, focus: T.s3 + 4.5,
  race: [1.6, 4.0, 6.4, 9.6, 10.4, 11.2, 12.0, 12.8, 13.6, 14.4, 15.2, 16.0, 16.8, 17.6].map((x) => T.s4 + x),
  finalLabel: T.s4 + 18.2,
  gridFocus: [T.s5 + 3.2, T.s5 + 5.4, T.s5 + 8.6, T.s5 + 11.4],
  podium: [T.s6 + 0.6, T.s6 + 1.4, T.s6 + 3.0],
  route: T.s7 + 5.6, routeEnd: T.s7 + 8.4,
};
// licht (1) of donker (0) per moment: dag in de meeste scènes, nacht voor de race en het eerlijke moment
function lightAt(t) {
  if (t < T.s2) return E.inOut(seg(t, CUE.sunrise[0], CUE.sunrise[1]));
  if (t < T.s4 - 0.5) return 1;
  if (t < T.s5 - 0.5) return 1 - E.inOut(seg(t, T.s4 - 0.5, T.s4 + 0.05));
  if (t < T.s7 - 0.4) return E.inOut(seg(t, T.s5 - 0.5, T.s5 + 0.05));
  if (t < T.s7 + 4.6) return 1 - E.inOut(seg(t, T.s7 - 0.4, T.s7 + 0.1));
  return E.inOut(seg(t, T.s7 + 4.6, T.s7 + 5.4));
}

const stage = document.getElementById("stage");
const renders = [];

/* ───────────── achtergrond: papier/nacht, hoogtelijnen, sterren ───────────── */
function makeContours(stroke, strokeMajor) {
  const W = 2240, H = 1360, step = 10;
  const cols = Math.ceil(W / step) + 1, rows = Math.ceil(H / step) + 1;
  const rnd = mulberry32(2027);
  const peaks = [];
  for (let i = 0; i < 11; i++) peaks.push({ x: rnd() * W, y: rnd() * H, a: (rnd() < 0.2 ? -0.5 : 0.55) + rnd() * 0.8, s: 150 + rnd() * 260 });
  const f = new Float32Array(cols * rows);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const x = i * step, y = j * step;
    let v = 0;
    for (const p of peaks) v += p.a * Math.exp(-((x - p.x) ** 2 + (y - p.y) ** 2) / (2 * p.s * p.s));
    v += 0.07 * Math.sin(x / 83 + Math.cos(y / 121) * 2) * Math.cos(y / 77 + Math.sin(x / 140));
    f[j * cols + i] = v;
  }
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.lineCap = "round";
  for (let k = 0, lv = -0.6; lv < 1.8; lv += 0.075, k++) {
    const major = k % 5 === 0;
    g.strokeStyle = major ? strokeMajor : stroke;
    g.lineWidth = major ? 1.6 : 1.1;
    g.beginPath();
    for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
      const a = f[j * cols + i], b = f[j * cols + i + 1], c = f[(j + 1) * cols + i + 1], d = f[(j + 1) * cols + i];
      const idx = (a > lv ? 8 : 0) | (b > lv ? 4 : 0) | (c > lv ? 2 : 0) | (d > lv ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const x = i * step, y = j * step;
      const Tp = [x + step * (lv - a) / (b - a), y], Rt = [x + step, y + step * (lv - b) / (c - b)];
      const Bt = [x + step * (lv - d) / (c - d), y + step], Lf = [x, y + step * (lv - a) / (d - a)];
      const segs = { 1: [[Lf, Bt]], 2: [[Bt, Rt]], 3: [[Lf, Rt]], 4: [[Tp, Rt]], 5: [[Lf, Tp], [Bt, Rt]], 6: [[Tp, Bt]], 7: [[Lf, Tp]],
        8: [[Lf, Tp]], 9: [[Tp, Bt]], 10: [[Tp, Rt], [Lf, Bt]], 11: [[Tp, Rt]], 12: [[Lf, Rt]], 13: [[Bt, Rt]], 14: [[Lf, Bt]] }[idx];
      for (const [p, q] of segs) { g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); }
    }
    g.stroke();
  }
  cv.style.cssText = "position:absolute;left:-160px;top:-140px;width:2240px;height:1360px";
  return cv;
}
const bg = el("div", { class: "L" }, stage);
const stars = (() => {
  const cv = document.createElement("canvas"); cv.width = 1920; cv.height = 1080;
  const g = cv.getContext("2d"), rnd = mulberry32(5);
  for (let i = 0; i < 420; i++) { const r = rnd() < 0.08 ? 1.6 : 0.8; g.fillStyle = `rgba(237,230,209,${0.25 + rnd() * 0.6})`; g.beginPath(); g.arc(rnd() * 1920, rnd() * 1080, r, 0, 7); g.fill(); }
  cv.style.cssText = "position:absolute;left:0;top:0"; bg.appendChild(cv); return cv;
})();
const contNight = makeContours("rgba(124,240,196,0.075)", "rgba(124,240,196,0.16)");
const contDay = makeContours("rgba(16,38,44,0.07)", "rgba(16,38,44,0.13)");
bg.appendChild(contNight); bg.appendChild(contDay);
const vigNight = el("div", { class: "L", style: "background:radial-gradient(ellipse 75% 70% at 50% 50%, rgba(7,21,25,0) 40%, rgba(3,10,12,.85) 100%)" }, stage);
const vigDay = el("div", { class: "L", style: "background:radial-gradient(ellipse 80% 75% at 50% 45%, rgba(255,250,236,.55) 0%, rgba(239,231,212,0) 55%, rgba(150,120,70,.22) 100%)" }, stage);
renders.push((t) => {
  const l = lightAt(t);
  stage.style.background = hexLerp(N.bg, D.bg, l);
  const tr = `translate(${-40 * Math.sin(t / 30)}px,${-t * 1.3}px)`;
  contNight.style.transform = tr; contDay.style.transform = tr;
  contNight.style.opacity = (1 - l) * (0.3 + 0.7 * E.out(seg(t, 0, 2.4)));
  contDay.style.opacity = l;
  op(stars, t < T.s2 ? (1 - l) * E.out(seg(t, 0, 1.2)) : 0);
  op(vigNight, 1 - l); op(vigDay, l);
});

/* ───────────── WebGL (three.js): bol, diorama, podium ───────────── */
const glCanvas = el("canvas", { id: "gl", width: 1920, height: 1080 }, stage);
THREE.ColorManagement.legacyMode = false;
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const labLayer = el("div", { class: "L" }, stage); // labels die aan 3D-punten hangen
function project(cam, x, y, z) {
  const v = new THREE.Vector3(x, y, z).project(cam);
  return [(v.x + 1) * 960, (1 - v.y) * 540, v.z < 1];
}
function aimCam(cam, target, dist, elev, az) {
  const e = (elev * Math.PI) / 180, a = (az * Math.PI) / 180;
  cam.position.set(target[0] + dist * Math.cos(e) * Math.sin(a), target[1] + dist * Math.sin(e), target[2] + dist * Math.cos(e) * Math.cos(a));
  cam.lookAt(target[0], target[1], target[2]);
  cam.updateMatrixWorld();
}
const lerp3 = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
const col = (h) => new THREE.Color(h);

/* — de wereldbol — */
const GLOBE = (() => {
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30, 16 / 9, 0.1, 100);
  const cv = document.createElement("canvas"); cv.width = 4096; cv.height = 2048;
  const g = cv.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 2048);
  grd.addColorStop(0, "#8fbdb5"); grd.addColorStop(0.5, "#b2d5cc"); grd.addColorStop(1, "#8fbdb5");
  g.fillStyle = grd; g.fillRect(0, 0, 4096, 2048);
  g.scale(2, 2);
  g.strokeStyle = "rgba(16,38,44,.14)"; g.lineWidth = 1; g.stroke(new Path2D(MAP.grat));
  for (const c of MAP.globe) {
    const p = new Path2D(c.d);
    g.fillStyle = c.home ? "#e3bd52" : c.nl ? (isTop(c.nl) ? "#5cc79c" : "#9edcc1") : "#f3ead4";

function parseRings(d) {
  const rings = []; let cur = null; const re = /([MLZ])([^MLZ]*)/g; let m;
  while ((m = re.exec(d))) {
    if (m[1] === "Z") { if (cur && cur.length > 2) rings.push(cur); cur = null; continue; }
    const nums = m[2].split(/[ ,]+/).filter(Boolean).map(Number);
    if (m[1] === "M") { if (cur && cur.length > 2) rings.push(cur); cur = []; }
    for (let i = 0; i + 1 < nums.length; i += 2) {
      const pt = [nums[i], nums[i + 1]], lp = cur[cur.length - 1];
      if (!lp || lp[0] !== pt[0] || lp[1] !== pt[1]) cur.push(pt);
    }
  }
  if (cur && cur.length > 2) rings.push(cur);
  return rings.map((r) => { const a = r[0], b = r[r.length - 1]; if (a[0] === b[0] && a[1] === b[1]) r.pop(); return r; });
}

/* ═════════════ GELUID ═════════════
   Alles wordt hier zelf opgewekt: een kleine synthesizer in JavaScript (oscillatoren, filters,
   galm), gerenderd tot één stereospoor dat exact met de tijdlijn meeloopt.
   Tempo 120: 1 tel = 0,5 s, 1 maat = 2 s. Toonsoort d-klein, slot in D-groot. */
const SR = 44100;

// De partituur: een lijst gebeurtenissen (instrument + tijd + parameters)
function buildScore() {
  const EV = [];
  const ev = (type, o) => EV.push(Object.assign({ type }, o));
  const pad = (t, dur, notes, gain, bright = 1) => ev("pad", { t, dur, notes, gain, bright });
  const bass = (t, dur, m, gain) => ev("bass", { t, dur, m, gain });
  const kick = (t, gain) => ev("kick", { t, gain });
  const hat = (t, gain, open = false, pan = 0.2) => ev("hat", { t, gain, open, pan });
  const snare = (t, gain) => ev("snare", { t, gain });
  const pluck = (t, m, gain, pan = 0, send = 0.45, len = 0.7) => ev("pluck", { t, m, gain, pan, send, len });
  const boom = (t, gain) => ev("boom", { t, gain });
  const riser = (t0, t1, gain) => ev("riser", { t: t0, t1, gain });
  const whoosh = (t, dur, gain, up = true, pan = 0) => ev("whoosh", { t, dur, gain, up, pan });
  const tick = (t, gain, freq = 2600) => ev("tick", { t, gain, freq });

  const PROG = [[50, 53, 57, 62], [46, 50, 53, 58], [48, 53, 57, 60], [48, 52, 55, 60]]; // Dm  Bb  F  C
  const ROOT = [38, 34, 41, 36];
  const chordAt = (t) => Math.floor(t / 4) % 4;
  const beat = 0.5;

  // 1 · de vraag
  pad(0, 8, [38, 50, 57, 62], 0.05, 0.7);
  [74, 77, 81, 86, 81, 77].forEach((m, i) => pluck(0.3 + i * 0.22, m, 0.05, i % 2 ? 0.5 : -0.5, 0.8, 1.2));
  CUE.hook.forEach((h, i) => { boom(h, 0.55); pad(h, 0.9, PROG[i].map((m) => m + 12), 0.035, 1.6); kick(h, 0.7); });
  pad(CUE.sunrise[0], CUE.sunrise[1] - CUE.sunrise[0] + 1.6, [50, 57, 62, 66, 69], 0.04, 1.6); // zonsopgang (D-groot)
  whoosh(CUE.push, 1.4, 0.2, true);
  riser(6.3, T.s2, 0.25);
  // 2 · de weging
  boom(T.s2, 0.5);
  for (let t = T.s2; t < T.s3; t += 4) pad(t, 4, PROG[chordAt(t)], 0.045, 0.9);
  for (let t = T.s2; t < T.s3 - 0.1; t += 1) kick(t, 0.45);
  for (let t = T.s2 + 0.5; t < T.s3 - 0.1; t += 1) hat(t, 0.05);
  kick(CUE.countA, 0.7); pluck(CUE.countA, 62, 0.08, 0, 0.6, 1.0); // 188 slaat in
  for (let t = CUE.countA + 0.1; t < CUE.countB; t += 0.05) tick(t, 0.05, 2200 + (t - CUE.countA) * 900); // tegels verschijnen
  [62, 65, 69, 74].forEach((m, i) => pluck(CUE.grow + i * 0.08, m, 0.06, 0, 0.5, 0.5));
  whoosh(CUE.fly - 0.1, 1.1, 0.18, false);
  byWeight.forEach((c, i) => pluck(CUE.fillA + (i / 18) * (CUE.fillB - CUE.fillA) + 0.2, [38, 41, 43, 45, 48, 50, 53, 55, 57, 60, 62, 65, 67, 69][i], 0.09, 0, 0.3, 0.45));
  [74, 78, 81].forEach((m, i) => pluck(CUE.hl + i * 0.06, m, 0.07, (i - 1) * 0.4, 0.8, 1.4));
  pluck(CUE.coral, 46, 0.12, 0, 0.4, 1.0); pluck(CUE.coral + 0.12, 45, 0.1, 0, 0.4, 1.0);
  riser(T.s3 - 1.8, T.s3, 0.25);
  // 3 · de kandidaten
  boom(T.s3, 0.5);
  for (let t = T.s3; t < T.s4; t += 4) pad(t, 4, PROG[chordAt(t)], 0.045, 1.0);
  for (let t = T.s3; t < T.s4 - 0.1; t += 1) kick(t, 0.45);
  for (let t = T.s3 + 0.5; t < T.s4 - 0.1; t += 0.5) hat(t, 0.045, false, t % 1 ? 0.3 : -0.3);
  const penta = [62, 65, 67, 69, 72, 74, 77, 79, 81, 84];
  pinOrder.forEach((n, i) => pluck(CUE.pinA + i * CUE.pinStep, penta[i % penta.length] - (i >= 10 ? 12 : 0), 0.055, (MAP.pts[n][0] - 960) / 960, 0.5, 0.5));
  whoosh(CUE.focus - 0.2, 0.8, 0.16, false);
  [69, 74, 78].forEach((m) => pluck(CUE.focus + 0.2, m, 0.06, 0, 0.8, 1.6));
  riser(T.s4 - 1.8, T.s4, 0.3);
  // 4 · de race (volle groove)
  boom(T.s4, 0.6);
  const drop = CUE.race[2];
  const gap = (t) => t > drop - 0.5 && t < drop; // adempauze vlak voor de klap
  for (let t = T.s4; t < T.s5 - 0.1; t += 4) pad(t, 4, PROG[chordAt(t)], 0.04, 1.3);
  for (let t = T.s4; t < T.s5 - 0.05; t += beat) if (!gap(t + 0.01)) kick(t, 0.6);
  for (let t = T.s4 + 0.25; t < T.s5 - 0.1; t += beat) if (!gap(t)) hat(t, 0.07, Math.round((t - T.s4) / 0.25) % 4 === 3);
  for (let t = T.s4 + 2.5; t < T.s5 - 0.1; t += 1) if (!gap(t)) snare(t, t > CUE.finalLabel ? 0.12 : 0.18);
  for (let t = T.s4; t < T.s5 - 0.1; t += 0.25) if (!gap(t)) bass(t, 0.22, ROOT[chordAt(t)] + (Math.round((t - T.s4) / 0.25) % 8 === 6 ? 12 : 0), 0.14);
  for (let t = T.s4 + 4; t < T.s5 - 0.1; t += 0.125) {
    if (gap(t)) continue;
    const i = Math.round((t - T.s4) / 0.125);
    pluck(t, PROG[chordAt(t)][[0, 1, 2, 3, 2, 1, 3, 2][i % 8]] + 12, 0.032, i % 2 ? 0.45 : -0.45, 0.35, 0.22);
  }
  CUE.race.forEach((t, i) => { whoosh(t - 0.18, 0.35, i < 3 ? 0.16 : 0.09, true, i % 2 ? 0.4 : -0.4); tick(t, 0.07, 3200); });
  boom(drop, 0.75); pluck(drop, 41, 0.18, 0, 0.6, 1.4);
  boom(CUE.race[13], 0.6);
  pad(CUE.race[13], 3.2, [50, 57, 62, 65, 69], 0.04, 1.8);
  riser(T.s5 - 1.6, T.s5, 0.2);
  // 5 · het vergelijk (lichter)
  for (let t = T.s5; t < T.s6; t += 4) pad(t, 4, PROG[chordAt(t)], 0.05, 0.8);
  for (let t = T.s5; t < T.s6 - 0.1; t += 0.5) hat(t + 0.25, 0.045);
  for (let t = T.s5; t < T.s6 - 0.1; t += 1) kick(t, 0.32);
  for (let t = T.s5; t < T.s6 - 0.1; t += 0.25) { const i = Math.round((t - T.s5) / 0.25); pluck(t, PROG[chordAt(t)][[0, 2, 1, 3][i % 4]] + 12, 0.025, i % 2 ? 0.5 : -0.5, 0.5, 0.3); }
  for (let t = T.s5; t < T.s6 - 0.1; t += 0.5) bass(t, 0.45, ROOT[chordAt(t)], 0.08);
  for (let i = 0; i < 40; i++) tick(T.s5 + 0.8 + i * 0.045, 0.025, 1800 + i * 40);
  CUE.gridFocus.forEach((t, i) => { pluck(t, [74, 77, 81, 78][i], 0.08, 0, 0.8, 1.3); whoosh(t - 0.15, 0.3, 0.07); });
  // 6 · het podium: roffel, klap, D-groot
  boom(T.s6, 0.45);
  pad(T.s6, 2, [46, 50, 53, 58], 0.05, 1.2);
  pad(T.s6 + 2, 1.0, [48, 52, 55, 60], 0.05, 1.4);
  CUE.podium.slice(0, 2).forEach((t) => { kick(t, 0.6); pluck(t, 57, 0.08, 0, 0.5, 0.8); });
  for (let t = T.s6 + 1.6, step = 0.16; t < CUE.podium[2] - 0.03; t += step, step = Math.max(0.045, step * 0.88))
    snare(t, 0.06 + 0.16 * ((t - T.s6 - 1.6) / (CUE.podium[2] - T.s6 - 1.6)));
  riser(T.s6 + 1.2, CUE.podium[2], 0.3);
  boom(CUE.podium[2], 0.9);
  pad(CUE.podium[2], T.s7 - CUE.podium[2] - 0.4, [38, 50, 54, 57, 62, 66], 0.06, 1.8);
  for (let t = CUE.podium[2]; t < T.s7 - 0.6; t += 0.5) kick(t, 0.5);
  for (let t = CUE.podium[2] + 0.25; t < T.s7 - 0.6; t += 0.5) hat(t, 0.06, true);
  for (let t = CUE.podium[2]; t < T.s7 - 0.6; t += 0.25) bass(t, 0.22, 38, 0.12);
  [74, 78, 81, 86, 90].forEach((m, i) => pluck(CUE.podium[2] + 0.05 + i * 0.07, m, 0.07, (i - 2) * 0.3, 0.9, 1.6));
  for (let t = CUE.podium[2] + 1; t < T.s7 - 0.6; t += 0.125) { const i = Math.round((t - CUE.podium[2]) / 0.125); pluck(t, [62, 66, 69, 74][i % 4] + 12, 0.028, i % 2 ? 0.5 : -0.5, 0.4, 0.2); }
  // 7 · eerlijk is eerlijk: rustig, dan het slotakkoord
  pad(T.s7, 3, [46, 50, 53, 58], 0.045, 0.8);
  pad(T.s7 + 2.6, 2.4, [41, 48, 53, 57], 0.045, 0.8);
  [69, 67, 65, 62].forEach((m, i) => pluck(T.s7 + 1.8 + i * 0.4, m, 0.06, (i - 1.5) * 0.3, 0.7, 1.2));
  riser(T.s7 + 3.8, T.s7 + 5.0, 0.15);
  boom(T.s7 + 5.0, 0.5);
  pad(T.s7 + 5.0, 1.8, [48, 52, 55, 60], 0.05, 1.0);
  pad(CUE.routeEnd - 0.4, T.end - CUE.routeEnd + 0.2, [38, 50, 54, 57, 62, 66, 69], 0.06, 1.5);
  for (let t = CUE.route; t < CUE.routeEnd; t += 0.25) pluck(t, [62, 66, 69, 74, 78, 74, 69, 66][Math.round((t - CUE.route) / 0.25) % 8], 0.035, 0.3, 0.6, 0.4);
  [74, 78, 81, 86].forEach((m, i) => pluck(CUE.routeEnd - 0.2 + i * 0.12, m, 0.07, (i - 1.5) * 0.3, 1.0, 2.5));
  boom(CUE.routeEnd - 0.2, 0.4);
  return EV;
}

// De synthesizer zelf. Staat los van de rest zodat hij in een achtergrondthread kan draaien.
function synthCore() {
  const TAU = Math.PI * 2;
  function render(events, SR, dur) {
    const N = Math.ceil(SR * dur);
    const L = new Float32Array(N), R = new Float32Array(N), VL = new Float32Array(N), VR = new Float32Array(N);
    let seed = 2027;
    const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) / 4294967296) * 2 - 1; };
    const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const pan = (p) => { const a = ((clampP(p) + 1) * Math.PI) / 4; return [Math.cos(a) * Math.SQRT2, Math.sin(a) * Math.SQRT2]; };
    const clampP = (p) => Math.max(-1, Math.min(1, p));
    const BQ = () => ({ b0: 1, b1: 0, b2: 0, a1: 0, a2: 0, x1: 0, x2: 0, y1: 0, y2: 0 });
    function setBQ(f, type, freq, Q) { // 0 laagdoorlaat, 1 hoogdoorlaat, 2 banddoorlaat (0 dB top)
      const w = (TAU * Math.min(Math.max(freq, 20), SR * 0.45)) / SR, cs = Math.cos(w), sn = Math.sin(w), al = sn / (2 * Q);
      const a0 = 1 + al;
      let b0, b1, b2;
      if (type === 0) { b1 = 1 - cs; b0 = b1 / 2; b2 = b0; }
      else if (type === 1) { b1 = -(1 + cs); b0 = (1 + cs) / 2; b2 = b0; }
      else { b0 = al; b1 = 0; b2 = -al; }
      f.b0 = b0 / a0; f.b1 = b1 / a0; f.b2 = b2 / a0; f.a1 = (-2 * cs) / a0; f.a2 = (1 - al) / a0;
    }
    function bq(f, x) { const y = f.b0 * x + f.b1 * f.x1 + f.b2 * f.x2 - f.a1 * f.y1 - f.a2 * f.y2; f.x2 = f.x1; f.x1 = x; f.y2 = f.y1; f.y1 = y; return y; }
    const expRamp = (a, b, p) => a * Math.pow(b / a, Math.min(1, Math.max(0, p)));
    function blep(t, dt) { if (t < dt) { t /= dt; return t + t - t * t - 1; } if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; } return 0; }
    function span(t, len) { const i0 = Math.max(0, Math.round(t * SR)); return [i0, Math.min(N, i0 + Math.round(len * SR))]; }
    // exponentieel uitsterven tot 0,001 over d seconden
    const decay = (k, d) => (k >= d ? 0 : Math.pow(0.001, k / d));

    const I = {
      pad(e) {
        const a = Math.min(1.2, e.dur * 0.4), hold = Math.max(0, e.dur - 1.2), rel = 1.4, len = a + hold + rel;
        const [i0, i1] = span(e.t, len);
        const vs = [];
        e.notes.forEach((m, j) => [-8, 8].forEach((det) => vs.push({ f: mtof(m) * Math.pow(2, (det + (j - 1) * 2) / 1200), p: Math.abs(rnd()), side: det < 0 ? 0 : 1 })));
        const fl = BQ(), fr = BQ();
        const [gl0, gr0] = pan(-0.35), [gl1, gr1] = pan(0.35);
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR;
          if ((i - i0) % 32 === 0) {
            const fc = (500 + 1000 * Math.min(1, k / Math.min(e.dur, 3))) * e.bright;
            setBQ(fl, 0, fc, 0.707); fr.b0 = fl.b0; fr.b1 = fl.b1; fr.b2 = fl.b2; fr.a1 = fl.a1; fr.a2 = fl.a2;
          }
          let sl = 0, sr = 0;
          for (let v = 0; v < vs.length; v++) {
            const o = vs[v], dt = o.f / SR;
            const s = 2 * o.p - 1 - blep(o.p, dt);
            o.p += dt; if (o.p >= 1) o.p -= 1;
            if (o.side) sr += s; else sl += s;
          }
          const env = k < a ? k / a : k < a + hold ? 1 : Math.max(0, 1 - (k - a - hold) / rel);
          const yl = bq(fl, sl) * env * e.gain, yr = bq(fr, sr) * env * e.gain;
          const l = yl * gl0 + yr * gl1, r = yl * gr0 + yr * gr1;
          L[i] += l; R[i] += r; VL[i] += l * 0.6; VR[i] += r * 0.6;
        }
      },
      bass(e) {
        const a = 0.006, hold = e.dur * 0.5, rel = e.dur * 0.45;
        const [i0, i1] = span(e.t, a + hold + rel);
        const f = mtof(e.m), dt = f / SR, fl = BQ();
        let p = 0, ps = 0;
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR;
          if ((i - i0) % 16 === 0) setBQ(fl, 0, expRamp(900, 220, k / 0.15), 2);
          const saw = 2 * p - 1 - blep(p, dt);
          p += dt; if (p >= 1) p -= 1;
          const sn = Math.sin(TAU * ps); ps += dt; if (ps >= 1) ps -= 1;
          const env = k < a ? k / a : k < a + hold ? 1 : Math.max(0, 1 - (k - a - hold) / rel);
          const y = (bq(fl, saw) + sn) * env * e.gain;
          L[i] += y; R[i] += y; VL[i] += y * 0.05; VR[i] += y * 0.05;
        }
      },
      kick(e) {
        const [i0, i1] = span(e.t, 0.45);
        let ph = 0;
        const hp = BQ(); setBQ(hp, 1, 3000, 0.707);
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR;
          const f = expRamp(150, 44, k / 0.13);
          ph += f / SR;
          let y = Math.sin(TAU * ph) * e.gain * decay(k, 0.42);
          if (k < 0.016) y += bq(hp, rnd()) * e.gain * 0.25 * (k < 0.001 ? k / 0.001 : 1 - (k - 0.001) / 0.015);
          L[i] += y; R[i] += y;
        }
      },
      hat(e) {
        const d = e.open ? 0.22 : 0.05;
        const [i0, i1] = span(e.t, d + 0.01);
        const hp = BQ(); setBQ(hp, 1, 7800, 0.707);
        const [gl, gr] = pan(e.pan);
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR;
          const y = bq(hp, rnd()) * e.gain * decay(k, d);
          L[i] += y * gl; R[i] += y * gr; VL[i] += y * gl * 0.08; VR[i] += y * gr * 0.08;
        }
      },
      snare(e) {
        const [i0, i1] = span(e.t, 0.22);
        const bp = BQ(); setBQ(bp, 2, 1900, 0.7);
        let ph = 0;
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR;
          const n = bq(bp, rnd()) * e.gain * 2.2 * decay(k, 0.2);
          ph += expRamp(220, 150, k / 0.08) / SR;
          const tri = (1 - 4 * Math.abs((ph % 1) - 0.5)) * e.gain * 0.7 * decay(k, 0.1);
          const y = n + tri;
          L[i] += y; R[i] += y; VL[i] += n * 0.25 + tri * 0.1; VR[i] += n * 0.25 + tri * 0.1;
        }
      },
      pluck(e) {
        const [i0, i1] = span(e.t, e.len + 0.02);
        const f = mtof(e.m), dt = f / SR, lp = BQ();
        const [gl, gr] = pan(e.pan);
        let p = Math.abs(rnd()), p2 = 0;
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR;
          if ((i - i0) % 16 === 0) setBQ(lp, 0, expRamp(5000, 900, k / 0.3), 0.707);
          const tri = 1 - 4 * Math.abs(p - 0.5);
          p += dt; if (p >= 1) p -= 1;
          const sn = Math.sin(TAU * p2) * 0.35; p2 += dt * 2; if (p2 >= 1) p2 -= 1;
          const env = k < 0.004 ? k / 0.004 : decay(k - 0.004, e.len);
          const y = bq(lp, tri + sn) * env * e.gain;
          L[i] += y * gl; R[i] += y * gr; VL[i] += y * gl * e.send; VR[i] += y * gr * e.send;
        }
      },
      boom(e) {
        const [i0, i1] = span(e.t, 1.9);
        const lp = BQ();
        let ph = 0;
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR;
          ph += expRamp(90, 30, k / 1.3) / SR;
          const s = Math.sin(TAU * ph) * e.gain * decay(k, 1.8);
          if ((i - i0) % 16 === 0) setBQ(lp, 0, expRamp(2500, 120, k / 1.0), 0.707);
          const n = bq(lp, rnd()) * e.gain * 0.6 * decay(k, 1.1);
          L[i] += s + n; R[i] += s + n; VL[i] += s * 0.3 + n * 0.6; VR[i] += s * 0.3 + n * 0.6;
        }
      },
      riser(e) {
        const len = e.t1 - e.t;
        const [i0, i1] = span(e.t, len);
        const bp = BQ();
        let ph = 0;
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR, u = k / len;
          if ((i - i0) % 16 === 0) setBQ(bp, 2, expRamp(300, 7000, u), 4);
          let g = expRamp(0.0001, e.gain, k / (len - 0.02));
          if (k > len - 0.02) g = e.gain * Math.max(0, (len - k) / 0.02);
          ph += expRamp(180, 1400, u) / SR;
          const y = (bq(bp, rnd()) * 2.5 + Math.sin(TAU * ph) * 0.25) * g;
          L[i] += y; R[i] += y; VL[i] += y * 0.3; VR[i] += y * 0.3;
        }
      },
      whoosh(e) {
        const [i0, i1] = span(e.t, e.dur);
        const bp = BQ();
        const [gl, gr] = pan(e.pan);
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR, u = k / e.dur;
          if ((i - i0) % 16 === 0) setBQ(bp, 2, e.up ? expRamp(500, 3500, u) : expRamp(3500, 400, u), 1.4);
          const g = u < 0.6 ? expRamp(0.0001, e.gain, u / 0.6) : expRamp(e.gain, 0.0001, (u - 0.6) / 0.4);
          const y = bq(bp, rnd()) * 1.6 * g;
          L[i] += y * gl; R[i] += y * gr; VL[i] += y * gl * 0.2; VR[i] += y * gr * 0.2;
        }
      },
      tick(e) {
        const [i0, i1] = span(e.t, 0.04);
        for (let i = i0; i < i1; i++) {
          const k = (i - i0) / SR;
          const y = Math.sin(TAU * e.freq * k) * e.gain * decay(k, 0.035);
          L[i] += y; R[i] += y; VL[i] += y * 0.1; VR[i] += y * 0.1;
        }
      },
    };
    for (const e of events) I[e.type](e);

    // galm: Freeverb (8 kamfilters + 4 allpass per kanaal)
    const combT = [1116, 1188, 1277, 1356, 1422, 1491, 1557, 1617], apT = [556, 441, 341, 225], spread = 23;
    const fb = 0.86 * 0.28 + 0.7, damp = 0.45 * 0.4, wet = 0.55;
    for (let ch = 0; ch < 2; ch++) {
      const out = ch ? R : L, off = ch ? spread : 0;
      const combs = combT.map((n) => ({ b: new Float32Array(n + off), i: 0, s: 0 }));
      const aps = apT.map((n) => ({ b: new Float32Array(n + off), i: 0 }));
      for (let i = 0; i < N; i++) {
        const x = (VL[i] + VR[i]) * 0.015;
        let acc = 0;
        for (let c = 0; c < 8; c++) {
          const cb = combs[c], y = cb.b[cb.i];
          cb.s = y * (1 - damp) + cb.s * damp;
          cb.b[cb.i] = x + cb.s * fb;
          if (++cb.i >= cb.b.length) cb.i = 0;
          acc += y;
        }
        for (let a = 0; a < 4; a++) {
          const ap = aps[a], bo = ap.b[ap.i];
          ap.b[ap.i] = acc + bo * 0.5;
          acc = bo - acc;
          if (++ap.i >= ap.b.length) ap.i = 0;
        }
        out[i] += acc * wet;
      }
    }
    // normaliseren, zachte compressie, opnieuw normaliseren naar −1 dBFS
    const peakOf = () => { let p = 0; for (let i = 0; i < N; i++) { const a = Math.abs(L[i]), b = Math.abs(R[i]); if (a > p) p = a; if (b > p) p = b; } return p; };
    const scale = (k) => { for (let i = 0; i < N; i++) { L[i] *= k; R[i] *= k; } };
    const rawPeak = peakOf();
    scale(1 / rawPeak);
    const thr = Math.pow(10, -20 / 20), ratio = 4, att = Math.exp(-1 / (0.004 * SR)), relc = Math.exp(-1 / (0.2 * SR));
    let envc = 0;
    for (let i = 0; i < N; i++) {
      const x = Math.max(Math.abs(L[i]), Math.abs(R[i]));
      envc = x > envc ? att * envc + (1 - att) * x : relc * envc + (1 - relc) * x;
      if (envc > thr) { const g = Math.pow(envc / thr, 1 / ratio - 1); L[i] *= g; R[i] *= g; }
    }
    // zachte begrenzer: luider zonder harde clipping
    scale(1.9 / peakOf());
    for (let i = 0; i < N; i++) { L[i] = Math.tanh(L[i]); R[i] = Math.tanh(R[i]); }
    scale(0.93 / peakOf());
    const fadeN = Math.round(SR * 1.2);
    for (let i = 0; i < fadeN; i++) { const g = i / fadeN; L[N - 1 - i] *= g; R[N - 1 - i] *= g; }
    return { L, R, rawPeak };
  }
  return { render };
}

function renderScore() {
  const events = buildScore();
  const dur = T.end + 0.6;
  return new Promise((resolve, reject) => {
    let worker = null;
    try {
      const src = synthCore.toString() + "\nconst core = synthCore();\nonmessage = (e) => { const r = core.render(e.data.events, e.data.SR, e.data.dur); postMessage(r, [r.L.buffer, r.R.buffer]); };";
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    } catch (e) { worker = null; }
    const local = () => setTimeout(() => { try { resolve(synthCore().render(events, SR, dur)); } catch (e) { reject(e); } }, 50);
    if (!worker) return local();
    worker.onmessage = (e) => { resolve(e.data); worker.terminate(); };
    worker.onerror = (e) => { e.preventDefault(); worker.terminate(); local(); };
    worker.postMessage({ events, SR, dur });
  }).then((r) => {
    const buf = new AudioBuffer({ length: r.L.length, numberOfChannels: 2, sampleRate: SR });
    buf.copyToChannel(r.L, 0); buf.copyToChannel(r.R, 1);
    return { buf, peak: r.rawPeak, events: events.length };
  });
}


/* ───────────── afspelen ───────────── */
let t = 0, playing = false, last = 0;
const DUR = T.end;
function render(tt) { for (const f of renders) f(tt); }
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  // scherpe 3D bij grote schermen
  const pr = clamp(s * (window.devicePixelRatio || 1), 1, 1.5);
  if (Math.abs(pr - renderer.getPixelRatio()) > 0.01) { renderer.setPixelRatio(pr); renderer.setSize(1920, 1080, false); render(t); }
}
addEventListener("resize", fit); fit();

let actx = null, abuf = null, asrc = null, aGain = null, aStart = 0, muted = false;
const sndState = document.getElementById("sndState");
function audioStart() {
  if (!abuf) return;
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); aGain = actx.createGain(); aGain.connect(actx.destination); }
  if (actx.state === "suspended") actx.resume();
  audioStop();
  aGain.gain.value = muted ? 0 : 1;
  asrc = actx.createBufferSource(); asrc.buffer = abuf; asrc.connect(aGain);
  asrc.start(0, Math.min(t, abuf.duration - 0.01));
  aStart = actx.currentTime - t;
}
function audioStop() { if (asrc) { try { asrc.stop(); } catch (e) {} asrc.disconnect(); asrc = null; } }
const bPlay = document.getElementById("bPlay"), bar = document.getElementById("bar"), startEl = document.getElementById("start");
const timeEl = document.getElementById("time"), scrub = document.getElementById("scrub"), bMute = document.getElementById("bMute");
const fi = scrub.querySelector(".fi"), kn = scrub.querySelector(".kn");
CHAPTERS.slice(1).forEach(([, a]) => el("div", { class: "ch", style: `left:${(a / DUR) * 100}%` }, scrub));
const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 2 L16 9 L4 16 Z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 2h3.5v14H4zM10.5 2H14v14h-3.5z" fill="currentColor"/></svg>';
const ICON_SND = '<svg width="20" height="18" viewBox="0 0 20 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6h4l5-4v14l-5-4H2z" fill="currentColor"/><path d="M14 5c1.5 1.2 1.5 6.8 0 8M16.5 2.5c3 2.6 3 10.4 0 13"/></svg>';
const ICON_MUTE = '<svg width="20" height="18" viewBox="0 0 20 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6h4l5-4v14l-5-4H2z" fill="currentColor"/><path d="M14 6l5 6M19 6l-5 6"/></svg>';
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function ui() {
  bPlay.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  bMute.innerHTML = muted ? ICON_MUTE : ICON_SND;
  timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
  fi.style.width = (t / DUR) * 100 + "%"; kn.style.left = (t / DUR) * 100 + "%";
}
function play() { if (t >= DUR) t = 0; playing = true; last = performance.now(); startEl.classList.add("gone"); audioStart(); poke(); ui(); }
function pause() { playing = false; audioStop(); showBar(); ui(); }
function toggle() { playing ? pause() : play(); }
function seek(s) { t = clamp(s, 0, DUR); render(t); if (playing) audioStart(); ui(); }
function setMute(m) { muted = m; if (aGain) aGain.gain.value = muted ? 0 : 1; ui(); }
function loop(now) {
  if (playing) {
    if (asrc && actx && actx.state === "running") t = actx.currentTime - aStart;
    else t += Math.min(0.1, (now - last) / 1000);
    if (t >= DUR) { t = DUR; playing = false; audioStop(); showBar(); }
    render(t); ui();
  }
  last = now;
  requestAnimationFrame(loop);
}
let idleTimer = 0, uiHidden = false;
function showBar() { if (!uiHidden) bar.classList.remove("hide"); document.body.classList.remove("idle"); }
function poke() {
  showBar();
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (playing) { bar.classList.add("hide"); document.body.classList.add("idle"); } }, 1800);
}
addEventListener("mousemove", poke);
bPlay.onclick = toggle;
bMute.onclick = () => setMute(!muted);
document.getElementById("bRestart").onclick = () => { seek(0); play(); };
document.getElementById("bFull").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
startEl.onclick = play;
let dragging = false;
const scrubTo = (e) => { const r = scrub.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * DUR); };
scrub.addEventListener("pointerdown", (e) => { dragging = true; scrub.setPointerCapture(e.pointerId); scrubTo(e); });
scrub.addEventListener("pointermove", (e) => dragging && scrubTo(e));
scrub.addEventListener("pointerup", () => (dragging = false));
addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.key === "k") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") seek(t + 5);
  else if (e.key === "ArrowLeft") seek(t - 5);
  else if (e.key === "r" || e.key === "R") { seek(0); play(); }
  else if (e.key === "m" || e.key === "M") setMute(!muted);
  else if (e.key === "f" || e.key === "F") document.getElementById("bFull").click();
  else if (e.key === "h" || e.key === "H") { uiHidden = !uiHidden; bar.classList.toggle("hide", uiHidden); }
  poke();
});

// testhaakjes: ?t=42 (pauzeer op 42 s) · ?play · ?clean (zonder bediening) · ?nosound
const qs = new URLSearchParams(location.search);
const audioReady = qs.has("nosound") ? Promise.resolve(null) : renderScore().then((r) => {
  abuf = r.buf; sndState.textContent = "geluid klaar ♪";
  if (playing) audioStart();
  return r;
}).catch((e) => { sndState.textContent = "geluid niet beschikbaar in deze browser"; console.error(e); return null; });
window.__film = { seek, play, pause, get t() { return t; }, DUR, render, CUE, T, audioReady, get abuf() { return abuf; } };
document.fonts.ready.then(() => {
  POD.drawFaces();
  render(0); ui();
  if (qs.has("clean")) document.getElementById("ui").style.display = "none";
  if (qs.has("t")) { startEl.classList.add("gone"); seek(parseFloat(qs.get("t"))); }
  if (qs.has("play")) play();
  requestAnimationFrame(loop);
});
</script>
