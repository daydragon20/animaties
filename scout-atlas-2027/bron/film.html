<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout Atlas 2027</title>
<style>
/*__FONTS__*/
:root{
  --disp:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --night:#04090b; --ink:#04090b; --paper:#efe9da; --muted:#9bb0ac; --soft:#c3d2ce;
  --gold:#f2c374; --mint:#7cf0c4; --coral:#ff8b66; --line:rgba(239,233,218,.16);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--paper)}
body.idle,body.idle *{cursor:none!important}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:#071519;color:#ede6d1;font-family:var(--mono);-webkit-font-smoothing:antialiased}
.L{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.a{position:absolute;white-space:nowrap}
.kick{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:.28em;text-transform:uppercase}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.roman{font-family:var(--serif);font-style:normal;font-weight:500}
.disp{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.9}
.mono{font-family:var(--mono)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .05em .14em;margin:0 -.05em}
.w>span{display:inline-block}
.w>span.hl{color:var(--hlc)}
svg text{font-family:var(--mono)}
#gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
.lab3{position:absolute;left:0;top:0;pointer-events:none}
.lab3 .dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#12876a;border:3px solid #f8f3e6;box-shadow:0 2px 6px rgba(16,38,44,.35)}
.lab3 .pill{position:absolute;padding:4px 12px 5px;border-radius:6px;font:600 25px var(--mono);white-space:nowrap;background:rgba(248,243,230,.95);color:#10262c;box-shadow:0 2px 8px rgba(16,38,44,.2)}
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;opacity:.045;mix-blend-mode:screen;image-rendering:pixelated}

/* ── speler: hoort niet bij het filmbeeld ── */
#ui{position:fixed;inset:0;pointer-events:none;font-family:var(--mono);color:var(--paper)}
#start{position:absolute;inset:0;pointer-events:auto;overflow:hidden;background:#030607;transition:opacity .8s ease, visibility .8s}
#start.gone{opacity:0;visibility:hidden;pointer-events:none}
#startFx{position:absolute;inset:0;width:100%;height:100%}
#start .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#start .top{position:absolute;left:28px;right:28px;top:22px;display:flex;justify-content:space-between;font-size:14px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
#start .bot{position:absolute;left:28px;right:28px;bottom:22px;display:flex;justify-content:space-between;gap:16px;font-size:14px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;flex-wrap:wrap}
#start .corner{position:absolute;width:22px;height:22px;border-color:rgba(239,233,218,.4);border-style:solid;border-width:0}
#start .c1{left:14px;top:14px;border-left-width:1px;border-top-width:1px}#start .c2{right:14px;top:14px;border-right-width:1px;border-top-width:1px}
#start .c3{left:14px;bottom:14px;border-left-width:1px;border-bottom-width:1px}#start .c4{right:14px;bottom:14px;border-right-width:1px;border-bottom-width:1px}
#start .k{font-size:16px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:22px;padding-left:.4em}
#start h1{margin:0;font-family:var(--disp);font-weight:800;font-size:clamp(64px,13vw,190px);line-height:.82;letter-spacing:.02em;text-transform:uppercase}
#start h1 span{font-weight:200;color:var(--gold)}
#start .sub{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.6vw,36px);color:var(--soft);margin-top:22px}
#play{all:unset;cursor:pointer;margin-top:44px;position:relative;width:124px;height:124px;border-radius:50%;display:grid;place-items:center}
#play svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
#play .tri{margin-left:8px;transition:transform .3s}
#play:hover .tri{transform:scale(1.12)}
#play:focus-visible{outline:2px solid var(--mint);outline-offset:6px}
#play::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(124,240,196,.35);animation:pulse 2.6s ease-out infinite;opacity:0}
#play.ready::after{opacity:1}
@keyframes pulse{0%{transform:scale(.86);opacity:.8}100%{transform:scale(1.35);opacity:0}}
#sndState{margin-top:18px;font-size:15px;letter-spacing:.12em;color:var(--soft);min-height:20px}
#start .alt{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pill{all:unset;cursor:pointer;font:500 16px var(--mono);letter-spacing:.06em;padding:12px 22px;border-radius:999px;border:1px solid rgba(239,233,218,.3);color:var(--paper);transition:background .2s,border-color .2s}
.pill:hover{background:rgba(124,240,196,.1);border-color:rgba(124,240,196,.6)}
.pill:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

#ctrl{position:absolute;left:0;right:0;bottom:0;pointer-events:none;transition:opacity .45s ease}
#ctrl.hide{opacity:0}
#ctrl .shade{position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,0))}
#tl{position:absolute;left:28px;right:28px;bottom:24px;height:28px;pointer-events:auto;cursor:pointer;touch-action:none}
#tl .seg{position:absolute;top:12px;height:3px;background:rgba(239,233,218,.28);border-radius:1px;transition:height .15s, top .15s}
#tl:hover .seg{top:11px;height:5px}
#tl .seg i{position:absolute;left:0;top:0;bottom:0;background:var(--paper);border-radius:1px}
#tl .seg.cur i{background:var(--mint)}
#tl .head{position:absolute;top:14px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(124,240,196,.2),0 0 18px rgba(124,240,196,.8)}
#tl .tip{position:absolute;bottom:28px;transform:translateX(-50%);padding:7px 12px;border-radius:6px;background:rgba(6,14,16,.94);border:1px solid rgba(239,233,218,.2);font-size:15px;letter-spacing:.05em;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
#tl:hover .tip{opacity:1}
#tl .tip b{color:var(--mint);font-weight:500}
#row{position:absolute;left:28px;right:28px;bottom:60px;display:flex;align-items:center;gap:6px;pointer-events:auto}
#row button{all:unset;cursor:pointer;height:42px;min-width:42px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;color:var(--paper);font:500 15px var(--mono);letter-spacing:.06em}
#row button:hover{background:rgba(239,233,218,.12)}
#row button:focus-visible{outline:2px solid var(--mint)}
#row .time{font-size:15px;color:var(--paper);letter-spacing:.05em;font-variant-numeric:tabular-nums;margin:0 10px}
#row .chap{flex:1;text-align:center;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#row .chap b{color:var(--paper);font-weight:500}
#row .data{border:1px solid rgba(124,240,196,.5);color:var(--mint)}
@media (max-width:720px){#row .chap{display:none}#row .lbl{display:none}}

/*__VERKENNER_CSS__*/
</style>
<!--__THREE__-->
</head>
<body>
<div id="stage"></div>

<div id="ui">
  <div id="start" role="dialog" aria-label="Scout Atlas 2027">
    <canvas id="startFx"></canvas>
    <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
    <div class="top"><span id="stTop">Scout Atlas</span><span id="stDur">Film</span></div>
    <div class="wrap">
      <div class="k" id="stKick">Verkenners · zomer</div>
      <h1>Scout Atlas <span id="stYear"></span></h1>
      <div class="sub" id="stSub"></div>
      <button id="play" aria-label="Film afspelen">
        <svg class="ring" width="124" height="124" viewBox="0 0 118 118"><circle cx="59" cy="59" r="57" fill="none" stroke="rgba(239,233,218,.2)" stroke-width="1.5"/><circle id="ringP" cx="59" cy="59" r="57" fill="none" stroke="#7cf0c4" stroke-width="2" stroke-linecap="round" stroke-dasharray="358.1" stroke-dashoffset="358.1"/></svg>
        <svg class="tri" width="34" height="38" viewBox="0 0 34 38"><path d="M2 2 L32 19 L2 36 Z" fill="#efe9da"/></svg>
      </button>
      <div id="sndState">muziek wordt gecomponeerd…</div>
      <div class="alt">
        <button class="pill" id="stData">Meteen naar de data →</button>
      </div>
    </div>
    <div class="bot"><span>spatie = afspelen / pauze</span><span>← → = 10 s</span><span>F = volledig scherm</span><span>H = bediening verbergen</span><span>D = data</span></div>
  </div>

  <div id="ctrl" class="hide">
    <div class="shade"></div>
    <div id="row">
      <button id="bPlay" aria-label="Afspelen of pauzeren"></button>
      <button id="bBack" aria-label="10 seconden terug" title="10 s terug (←)"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10a6 6 0 1 0 2-4.5"/><path d="M3 3v4h4"/></svg></button>
      <button id="bFwd" aria-label="10 seconden vooruit" title="10 s vooruit (→)"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M17 3v4h-4"/></svg></button>
      <span class="time" id="time">0:00 / 0:00</span>
      <span class="chap" id="chap"></span>
      <button id="bMute" aria-label="Geluid aan of uit" title="Geluid (M)"></button>
      <button id="bData" class="data" title="Data verkennen (D)"><span class="lbl">data</span> →</button>
      <button id="bFull" aria-label="Volledig scherm" title="Volledig scherm (F)"><svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 6V1h5M12 1h5v5M17 12v5h-5M6 17H1v-5"/></svg></button>
    </div>
    <div id="tl" role="slider" aria-label="Tijdlijn" tabindex="0"><div class="tip"></div><div class="head"></div></div>
  </div>
</div>

<!--__VERKENNER_HTML__-->

<script>
"use strict";
const DATA = /*__DATA__*/null;
const MAP = /*__MAP__*/null;
const KAMP = /*__KAMP__*/null;
/*__JS__*/
</script>
</body>
</html>
